<!doctype html>
<html lang="es">

<head>
  <!-- Charset and viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Core App Tags: the build writes each page's own title, description and Open Graph texts
       from tooling/agent-files/routes.ts; the values here only serve the dev server. -->
  <title>Gonzalo Martínez | Desarrollador Full Stack</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Portafolio de Gonzalo Martínez, Desarrollador Full Stack en Palma de Mallorca, España: aplicaciones web, de escritorio y móviles con React, TypeScript, Spring Boot, .NET y Flutter." />
  <meta name="author" content="Gonzalo Martínez García" />
  <meta name="copyright" content="© 2026 Gonzalo Martínez García. All rights reserved." />

  <!-- Theme: paint the saved or system theme before the app loads, so dark and glass visitors
       never see a white page. It mirrors ThemeProvider and createAppTheme (ThemeProvider.test.tsx
       runs it). Any change to it needs its new hash in the CSP of vercel.json
       (tooling/hosting/vercelConfig.test.ts prints the expected value). -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#121212" />
  <script>
    (function () {
      var backgrounds = { light: '#f5f5f5', dark: '#121212', glass: '#030314' };
      var mode = null;
      try {
        mode = localStorage.getItem('themeMode');
      } catch (blocked) {
        // Site data is blocked: follow the system.
      }
      if (!Object.prototype.hasOwnProperty.call(backgrounds, mode)) {
        mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      var root = document.documentElement.style;
      root.backgroundColor = backgrounds[mode];
      root.colorScheme = mode === 'light' ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', backgrounds[mode]);
    })();
  </script>

  <!-- Open Graph: image paths are root-relative; the build makes them absolute. -->
  <meta property="og:title" content="Gonzalo Martínez | Desarrollador Full Stack" />
  <meta property="og:description" content="Portafolio de Gonzalo Martínez, Desarrollador Full Stack en Palma de Mallorca, España: aplicaciones web, de escritorio y móviles con React, TypeScript, Spring Boot, .NET y Flutter." />
  <meta property="og:image" content="/og-cover-typographic-full-stack.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:image:alt" content="GONZALO.DEV card: Gonzalo Martínez, Full Stack Developer, with React, TypeScript, Spring Boot, .NET and Flutter" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/og-cover-typographic-full-stack.jpg" />
  <meta name="twitter:image:alt" content="GONZALO.DEV card: Gonzalo Martínez, Full Stack Developer, with React, TypeScript, Spring Boot, .NET and Flutter" />

  <!-- Icons: the GONZALO.DEV monogram. /icons/ is cached immutable (vercel.json), so a new icon
       needs new file names. The ICO keeps sizes="32x32" so browsers prefer the SVG. -->
  <link rel="icon" href="/icons/gonzalo-dev.ico" sizes="32x32" />
  <link rel="icon" href="/icons/gonzalo-dev.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/gonzalo-dev-180.png" />
  <!-- Available before the app CSS/JS. Scoped to the temporary root content that React replaces. -->
  <style>
    .app-startup {
      box-sizing: border-box;
      min-height: calc(100svh - 16px);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      color: CanvasText;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }
    .app-startup-brand { margin: 0; font-size: 1.125rem; font-weight: 750; letter-spacing: 0.08em; }
    .app-startup-brand span { opacity: 0.75; }
    .app-startup progress {
      appearance: none;
      box-sizing: border-box;
      width: 2rem;
      height: 2rem;
      border: 3px solid color-mix(in srgb, currentColor 20%, transparent);
      border-top-color: currentColor;
      border-radius: 50%;
      background: transparent;
      color: inherit;
    }
    .app-startup progress::-webkit-progress-bar { display: none; }
    .app-startup progress::-webkit-progress-value { display: none; }
    .app-startup progress::-moz-progress-bar { display: none; }
    @keyframes startup-spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: no-preference) {
      .app-startup progress { animation: startup-spin 1s linear infinite; }
    }
    @media print { .app-startup progress { display: none; } }
  </style>
  <noscript><style>.app-startup { display: none; }</style></noscript>
</head>

<body>
  <div id="root">
    <main class="app-startup">
      <p class="app-startup-brand">GONZALO<span>.DEV</span></p>
      <progress aria-label="Cargando portafolio"></progress>
    </main>
  </div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
